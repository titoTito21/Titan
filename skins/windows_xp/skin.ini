; Windows XP (Luna Blue)
;
; The colours of the shell section are the measured gradient stops of the
; Luna taskbar, notification area and Start menu - the same table a
; pixel-accurate reimplementation of the XP taskbar uses - so Titan's shell
; matches a screenshot of XP band for band rather than being "blue-ish".
;
; This file is also the reference for what a skin may say about the system
; shell: any of the keys under [Shell] can be given by any other skin.

[Colors]
frame_background_color = #ECE9D8
panel_background_color = #ECE9D8
listbox_background_color = #FFFFFF
listbox_foreground_color = #000000
listbox_selection_background_color = #316AC5
listbox_selection_foreground_color = #FFFFFF
label_foreground_color = #000000
toolbar_background_color = #ECE9D8
button_face_color = #ECE9D8
button_shadow_color = #ACA899
button_highlight_color = #FFFFFF
text_color = #000000
window_background_color = #FFFFFF

[Fonts]
default_font_size = 8
default_font_face = Tahoma
listbox_font_face = Tahoma
statusbar_font_face = Tahoma
title_font_face = Tahoma
button_font_face = Tahoma
menu_font_face = Tahoma

[StartMenu]
style = xp
show_user_picture = true
show_recent_documents = true
show_programs_submenu = true
logo_text = Windows XP
logo_text_color = #FFFFFF
logo_background_color = #245EDB

[Shell]
; luna (the XP look) or classic (the grey 3D one)
style = luna
taskbar_height = 30

; The taskbar: five bands, the bright hairline at the top being what makes
; it read as XP rather than as a flat blue strip.
taskbar_gradient = #3888e9 0.0, #4993e6 0.05, #2257d5 0.18, #2663e0 0.9, #1941a5 1.0
taskbar_border = #3168d5

; The green Start capsule.
start_gradient = #3f9f3f 0.0, #53b153 0.06, #2f8f2f 0.4, #1c691c 0.9, #14520f 1.0
start_gradient_hover = #63c163 0.0, #78d178 0.06, #43a343 0.4, #2a7d2a 0.9, #1d661a 1.0
start_gradient_pressed = #1c5f1c 0.0, #2b7a2b 0.1, #2f8b2f 0.9, #3f9f3f 1.0
start_border = #12520f
start_text = #ffffff
start_text_shadow = #454c10

; Window buttons.
task_gradient = #4892f7 0.0, #3980f4 0.17, #3980f4 1.0
task_gradient_hover = #8bc0ff 0.0, #59a4ff 0.05, #569fff 0.9, #2a81ff 1.0
task_gradient_pressed = #123d94 0.0, #1951b9 0.05, #1a50b8 0.8, #2156b7 1.0
task_gradient_flashing = #ffb843 0.0, #e37a08 0.17, #e37a08 1.0
task_border_top = #3172da
task_border_left = #3067dd
task_border_right = #264fad
task_border_bottom = #2652bc
task_border_top_pressed = #1c62d2
task_border_left_pressed = #082970
task_border_right_pressed = #0e3c9f
task_border_bottom_pressed = #0c3cae
task_text = #ffffff

; The notification area.
tray_gradient = #16adf0 0.0, #19b9f3 0.05, #1290e8 0.18, #0d8dea 0.6, #0fa0ef 0.9, #1582dc 1.0
tray_border = #095bc9
tray_separator_light = #22c4f4
tray_separator_dark = #22b9e5
clock_text = #ffffff

; The Start menu.
menu_header = #2a63d8 0.0, #3b7ce8 0.1, #1b4ec4 0.9, #123fae 1.0
menu_header_text = #ffffff
menu_left_background = #ffffff
menu_right_background = #d3e5fa
menu_left_text = #000000
menu_right_text = #0a246a
menu_selection = #2f71cd
menu_selection_text = #ffffff
menu_separator = #c1d2ee
menu_border = #1c3f9e
menu_footer = #3f8ef7 0.0, #2f7ae8 0.15, #1c56c8 0.9, #123fae 1.0
menu_footer_text = #ffffff

; The desktop.
desktop_background = #004e98
desktop_text = #ffffff
desktop_selection = #316ac5

[Sounds]
theme = default

[Interface]
button_style = xp
border_style = xp
scroll_style = xp
menu_style = xp
