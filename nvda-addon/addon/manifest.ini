name = titanEnhancements
summary = "Titan enhancements"
description = """Makes NVDA a first-class citizen of the Titan desktop.

Titan's own announcements arrive with their structure intact - where a
control is in the stereo image, how high the voice should be, what role and
state the thing has, what belongs in braille - instead of as a flat string
through the NVDA controller. Position, pitch, rate and volume are applied to
whichever synthesizer you are using; a Titan voice is offered as one more
synthesizer but is never required.

In the other direction, Titan's own subsystems become NVDA commands: its
sound themes, its AI OCR for a window nothing else can read, its actions and
its macros.

Titan does not have to be running. When it is not, this add-on does nothing
at all and costs nothing."""
author = "Titosoft <klaldekwypych@gmail.com>"
url = https://github.com/titosoft/Titan
version = 1.0.0
docFileName = readme.html
minimumNVDAVersion = 2023.3
lastTestedNVDAVersion = 2027.1
