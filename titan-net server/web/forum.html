<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="forum.title">Forum &mdash; Titan-Net</title>
  <link rel="stylesheet" href="css/titan.css?v=20260825b">
  <!-- The forum IS the groups: every topic lives in a forum inside a
       group, and has done since the backfill migration moved the flat
       forum into them. This page was the second, poorer view of the same
       data - it could not say which forum a topic was in, and its "move
       to another forum" asked the moderator to type an id they had to go
       and read off the groups page. It is kept only so that a bookmark,
       a link in an old post or a search engine still arrives somewhere.

       The redirect is a <meta> rather than script alone so it happens
       even with JavaScript off, and the page below is a real link, so a
       reader that has already begun announcing this page is not left
       with nothing to follow. -->
  <meta http-equiv="refresh" content="0; url=groups.html">
</head>
<body class="page">
  <a href="#main" class="skip-link" data-i18n="skip">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="row">
      <a href="index.html" class="brand" data-i18n="brand">Titan-Net</a>
    </div>
  </header>

  <main id="main">
    <h1 data-i18n="forum.title">Forum</h1>
    <p><a href="groups.html" id="forum-moved" data-i18n="forum.moved">The forum is now under Groups, where every forum lives. Go to the forum.</a></p>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p><span data-i18n="footer.copy">Titan-Net</span></p>
  </footer>

  <div id="live-polite" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/i18n.js?v=20260825b"></script>
  <script src="js/app.js?v=20260825b"></script>
  <script>
    // Carry the query string over, so a link that named a topic still does.
    location.replace('groups.html' + location.search + location.hash);
  </script>
</body>
</html>
